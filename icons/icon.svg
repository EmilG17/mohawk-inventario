  <path d="M392 180 V130 A10 10 0 0 0 382 120 H332" stroke="#5cb85c" stroke-width="16" stroke-linecap="round" fill="none" />
  <path d="M120 332 V382 A10 10 0 0 0 130 392 H180" stroke="#5cb85c" stroke-width="16" stroke-linecap="round" fill="none" />
  <path d="M392 332 V382 A10 10 0 0 1 382 392 H332" stroke="#5cb85c" stroke-width="16" stroke-linecap="round" fill="none" />
  <!-- Barras del código -->
  <rect x="160" y="160" width="16" height="192" rx="6" fill="#ffffff" />
  <rect x="192" y="160" width="32" height="192" rx="6" fill="#ffffff" />
  <rect x="240" y="160" width="16" height="192" rx="6" fill="#ffffff" />
  <rect x="272" y="160" width="48" height="192" rx="6" fill="#ffffff" />
  <rect x="336" y="160" width="16" height="192" rx="6" fill="#ffffff" />
