  <line x1="100" y1="256" x2="412" y2="256" stroke="#ff4d4f" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 8px #ff4d4f)" />
  <!-- Letra M de Mohawk -->
  <circle cx="256" cy="420" r="32" fill="url(#accent)" />
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>
